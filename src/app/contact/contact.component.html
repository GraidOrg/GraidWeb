<section class="section signup contact-page">
  <div class="wrap">
    <div class="form-card">
      <form *ngIf="!sent" (ngSubmit)="onSubmit()" novalidate aria-label="Contact form">
        <span class="eyebrow">Contact</span>
        <h2>Get in touch</h2>
        <p class="sub">Questions about Graid, pilots, or security? Send us a note and we'll reply within 2 business days. To start a free pilot, <a routerLink="/" fragment="signup" class="inline-link">join early access</a>.</p>

        <input class="honeypot" type="text" name="company" [(ngModel)]="model.company" tabindex="-1" autocomplete="off" aria-hidden="true" />

        <div class="field-grid">
          <div class="field">
            <label for="c-name">Name <span class="req">*</span></label>
            <input id="c-name" name="name" type="text" [(ngModel)]="model.name" required autocomplete="name" />
          </div>
          <div class="field">
            <label for="c-email">Email <span class="req">*</span></label>
            <input id="c-email" name="email" type="email" [(ngModel)]="model.email" required autocomplete="email" />
          </div>
          <div class="field full">
            <label for="c-subject">Subject <span class="req">*</span></label>
            <input id="c-subject" name="subject" type="text" [(ngModel)]="model.subject" required />
          </div>
          <div class="field full">
            <label for="c-message">Message <span class="req">*</span></label>
            <textarea id="c-message" name="message" [(ngModel)]="model.message" required></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-gold" [disabled]="submitting">{{ submitting ? 'Sending…' : 'Send message' }}</button>
          <span class="form-note">We reply within 2 business days.</span>
        </div>
        <p class="form-error" *ngIf="errorMsg">{{ errorMsg }}</p>
      </form>

      <div class="form-success" *ngIf="sent" aria-live="polite">
        <div class="check" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></div>
        <h3>Message sent</h3>
        <p>Thanks for reaching out. We'll get back to you within 2 business days.</p>
      </div>
    </div>
  </div>
</section>
